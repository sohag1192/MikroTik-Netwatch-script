<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netwatch Telegram Script Generator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 3rem 1.5rem;
        }

        .container {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 820px;
            box-shadow: 0 32px 64px -16px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.07);
        }

        /* ── Header ─────────────────────────────────── */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            font-size: 1.6rem;
            margin-bottom: 1rem;
            box-shadow: 0 8px 24px -4px rgba(79, 70, 229, 0.45);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }

        .header-subtitle {
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        /* ── Section label ───────────────────────────── */
        .section-label {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #475569;
            margin-bottom: 1rem;
        }

        /* ── Form grid ───────────────────────────────── */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            margin-bottom: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 0.45rem;
            color: #94a3b8;
            letter-spacing: 0.01em;
        }

        input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.75rem 1rem;
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 0.925rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            line-height: 1.5;
        }

        input::placeholder {
            color: #334155;
        }

        input:focus {
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
        }

        /* ── Divider ─────────────────────────────────── */
        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
            margin: 1.75rem 0;
        }

        /* ── Telegram config row ─────────────────────── */
        .telegram-section {
            margin-bottom: 1.75rem;
        }

        /* ── Generate button ─────────────────────────── */
        .btn-generate {
            width: 100%;
            padding: 0.9rem 1.5rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.15s;
            margin-bottom: 1.75rem;
            box-shadow: 0 4px 16px -4px rgba(79, 70, 229, 0.5);
        }

        .btn-generate:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px -6px rgba(79, 70, 229, 0.65);
        }

        .btn-generate:active {
            transform: translateY(0);
            opacity: 0.9;
        }

        /* ── Output area ─────────────────────────────── */
        .output-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.6rem;
        }

        .output-wrapper {
            position: relative;
        }

        textarea {
            width: 100%;
            height: 220px;
            background: rgba(8, 14, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 1.1rem 1.1rem;
            border-radius: 10px;
            color: #4ade80;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.825rem;
            line-height: 1.7;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: rgba(56, 189, 248, 0.3);
        }

        textarea::placeholder {
            color: #1e293b;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
        }

        /* ── Copy button ─────────────────────────────── */
        .btn-copy {
            background: rgba(51, 65, 85, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            padding: 0.4rem 0.9rem;
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.01em;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .btn-copy:hover {
            background: rgba(71, 85, 105, 0.9);
            color: #f1f5f9;
        }

        .btn-copy.copied {
            background: rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.4);
            color: #34d399;
        }

        /* ── Responsive ──────────────────────────────── */
        @media (max-width: 600px) {
            body { padding: 1.5rem 1rem; }
            .container { padding: 2rem 1.5rem; }
            .form-grid { grid-template-columns: 1fr; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header">
            <div class="header-icon">📡</div>
            <h1>Netwatch Script Generator</h1>
            <p class="header-subtitle">Generate MikroTik Netwatch scripts with Telegram alerts</p>
        </div>

        <!-- Host Info -->
        <p class="section-label">Host Configuration</p>
        <div class="form-grid">
            <div class="form-group">
                <label>Host IP Address</label>
                <input type="text" id="ipAddress" placeholder="192.168.13.46">
            </div>
            <div class="form-group">
                <label>Comment / English Name</label>
                <input type="text" id="engName" placeholder="e.g. DHAKA TO GAZIPUR LINK">
            </div>
            <div class="form-group full-width">
                <label>Bengali Location Name (for Telegram) &nbsp;<span style="font-size:0.7rem;color:#94a3b8;font-weight:400;">— লিঙ্কের পূর্ণ নাম বাংলায় লিখুন</span></label>
                <input type="text" id="benName" placeholder="যেমন: ঢাকা টু গাজীপুর অফিস">
            </div>
            <div class="form-group full-width">
                <label>লিঙ্ক টোটাল মিটার &nbsp;<span style="font-size:0.7rem;background:rgba(56,189,248,0.12);color:#38bdf8;border:1px solid rgba(56,189,248,0.3);border-radius:4px;padding:1px 7px;font-weight:600;letter-spacing:0.05em;">Optional</span></label>
                <input type="number" id="linkMeter" placeholder="e.g. 1500" min="0">
            </div>
        </div>

        <div class="divider"></div>

        <!-- Telegram Config -->
        <div class="telegram-section">
            <p class="section-label">Telegram Configuration</p>
            <div class="form-grid">
                <div class="form-group">
                    <label>Bot Token</label>
                    <input type="text" id="botId" value="719600063280:AAFhAgYxnKcOl7_yW7a0IfYBifwqZDdTkQRI">
                </div>
                <div class="form-group">
                    <label>Chat ID</label>
                    <input type="text" id="chatId" value="-1002700089369209">
                </div>
            </div>
        </div>

        <button class="btn-generate" onclick="generateScript()">&#9889; Generate Script</button>

        <div class="output-header">
            <p class="section-label" style="margin-bottom: 0;">Generated Script</p>
            <button class="btn-copy" onclick="copyToClipboard()">
                <span class="copy-icon">&#128203;</span>
                <span class="copy-text">Copy Code</span>
            </button>
        </div>
        <div class="output-wrapper">
            <textarea id="outputScript" readonly placeholder="Your generated MikroTik Netwatch script will appear here..."></textarea>
        </div>

        <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; font-size: 0.78rem; color: #64748b;">
            <span>MikroTik Netwatch Script Generator</span>
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <a href="https://hits.sh/github.com/sohag1192/MikroTik-Netwatch-script/" target="_blank" rel="noopener noreferrer">
                    <img src="https://hits.sh/github.com/sohag1192/MikroTik-Netwatch-script.svg?view=today-total&style=flat-square&label=Total+Hits&color=2563eb" alt="Total Hits" style="vertical-align: middle;" />
                </a>
            </div>
        </div>

    </div>

    <script>
        function generateScript() {
            const ip      = document.getElementById('ipAddress').value.trim();
            const engName   = document.getElementById('engName').value.trim();
            const benName   = document.getElementById('benName').value.trim();
            const botId     = document.getElementById('botId').value.trim();
            const chatId    = document.getElementById('chatId').value.trim();
            const linkMeter = document.getElementById('linkMeter').value.trim();

            if (!ip || !engName || !benName) {
                alert('Please fill in the IP Address, English Name, and Bengali Name.');
                return;
            }

            // Encode the Bengali location name for URL
            const encBenName = encodeURIComponent(benName);

            // Optional meter suffix — appended to messages when filled
            // Decoded: \n📏 লিঙ্ক দূরত্ব: X মিটার
            const meterSuffix = linkMeter
                ? '%0A%F0%9F%93%8F%20' + encodeURIComponent('লিঙ্ক দূরত্ব:') + '%20' + encodeURIComponent(linkMeter) + '%20' + encodeURIComponent('মিটার')
                : '';

            // Build host-status strings (link-up / link-down prefix + Bengali name)
            const hostStatusUp   = '%E2%9C%85%20%E0%A6%B2%E0%A6%BF%E0%A6%82%E0%A6%95%20%E0%A6%86%E0%A6%AA%0A%0A' + encBenName;
            const hostStatusDown = '%E2%9D%8C%20%E0%A6%B2%E0%A6%BF%E0%A6%82%E0%A6%95%20%E0%A6%A1%E0%A6%BE%E0%A6%89%E0%A6%A8%0A%0A' + encBenName;

            // URL-encoded message bodies (MikroTik script variables kept as literal strings)
            const msgUp   = '%E0%A6%B9%E0%A7%8B%E0%A6%B8%E0%A7%8D%E0%A6%9F:%20$NetHost%0A%E0%A6%85%E0%A6%AC%E0%A6%B8%E0%A7%8D%E0%A6%A5%E0%A6%BE:%20$HostStatus%0A%0A%E0%A6%B8%E0%A6%AE%E0%A6%AF%E0%A6%BC:%20$CurTime%20$CurDate' + meterSuffix;
            const msgDown = '%E0%A6%B9%E0%A7%8B%E0%A6%B8%E0%A7%8D%E0%A6%9F:%20$NetHost%0A%E0%A6%85%E0%A6%AC%E0%A6%B8%E0%A7%8D%E0%A6%A5%E0%A6%BE:%20$HostStatus%0A%0A%E0%A6%B8%E0%A6%AE%E0%A6%AF%E0%A6%BC:%20$CurTime%20$CurDate%0A%0A%F0%9F%93%8C%20%E0%A6%A6%E0%A7%8D%E0%A6%B0%E0%A6%B7%E0%A7%8D%E0%A6%9F%E0%A6%AC%E0%A7%8D%E0%A6%AF:%20%E0%A7%A7%20%E0%A6%A5%E0%A7%87%E0%A6%95%E0%A7%87%20%E0%A7%AB%20%E0%A6%AE%E0%A6%BF%E0%A6%A8%E0%A6%BF%E0%A6%9F%20%E0%A6%8F%E0%A6%B8%E0%A6%8F%E0%A6%AE%E0%A6%8F%E0%A6%B8%20%E0%A6%86%E0%A6%B8%E0%A6%9B%E0%A7%87%20%E0%A6%A8%E0%A6%BE,%20%E0%A6%A4%E0%A6%BE%E0%A6%B0%E0%A6%AA%E0%A6%B0%20%E0%A6%B2%E0%A6%BF%E0%A6%99%E0%A7%8D%E0%A6%95%E0%A6%9F%E0%A6%BF%20%E0%A6%A1%E0%A6%BE%E0%A6%89%E0%A6%A8%20%E0%A6%B9%E0%A6%AF%E0%A6%BC%E0%A7%87%20%E0%A6%97%E0%A7%87%E0%A6%9B%E0%A7%87%E0%A7%A4' + meterSuffix;

            const lines = [
                '/tool netwatch',
                'add host=' + ip + ' type=icmp startup-delay=1m interval=1m timeout=1s comment="' + engName + '" up-script={',
                ':local CurDate [/system clock get date]',
                ':local CurTime [/system clock get time]',
                ':local NetHost $host',
                ':local CHID "' + chatId + '"',
                ':local BotID "' + botId + '"',
                ':local HostStatus "' + hostStatusUp + '"',
                ':local Message "' + msgUp + '"',
                '/tool fetch url="https://api.telegram.org/bot$BotID/sendMessage?chat_id=$CHID&text=$Message" keep-result=no check-certificate=no',
                '} down-script={',
                ':local CurDate [/system clock get date]',
                ':local CurTime [/system clock get time]',
                ':local NetHost $host',
                ':local CHID "' + chatId + '"',
                ':local BotID "' + botId + '"',
                ':local HostStatus "' + hostStatusDown + '"',
                ':local Message "' + msgDown + '"',
                '/tool fetch url="https://api.telegram.org/bot$BotID/sendMessage?chat_id=$CHID&text=$Message" keep-result=no check-certificate=no',
                '}'
            ];

            document.getElementById('outputScript').value = lines.join('\n');
        }

        function copyToClipboard() {
            const textarea = document.getElementById('outputScript');
            if (!textarea.value) return;

            textarea.select();
            textarea.setSelectionRange(0, 99999);

            navigator.clipboard.writeText(textarea.value).then(function() {
                const btn = document.querySelector('.btn-copy');
                btn.querySelector('.copy-text').textContent = 'Copied!';
                btn.querySelector('.copy-icon').textContent = '\u2705';
                btn.classList.add('copied');

                setTimeout(function() {
                    btn.querySelector('.copy-text').textContent = 'Copy Code';
                    btn.querySelector('.copy-icon').textContent = '\uD83D\uDCCB';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
    </script>
</body>
</html>
